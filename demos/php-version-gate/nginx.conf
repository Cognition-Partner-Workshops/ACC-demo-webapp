server {
    listen 8080;
    server_tokens off;
    client_max_body_size 2k;
    location / {
        proxy_pass http://demo:8080;
        proxy_set_header Host $host;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

name: php-version-gate-demo
services:
  demo:
    # Local runtime from this session, pinned for repeatability, not a claim of CVE safety.
    image: php:8.3-cli@sha256:a59cecda6bd7ba9b117d3f1047963fdd6e04f8a87012401831ef3caf44324f9a
    command:
      - php
      - -d
      - display_errors=0
      - -d
      - expose_php=0
      - -d
      - "disable_functions=exec,system,shell_exec,passthru,popen,proc_open,pcntl_exec"
      - -d
      - allow_url_fopen=0
      - -S
      - 0.0.0.0:8080
      - -t
      - /app/public
      - /app/router.php
    user: "1000:1000"
    read_only: true
    working_dir: /app
    volumes:
      - ./public:/app/public:ro
      - ./policy.php:/app/policy.php:ro
      - ./router.php:/app/router.php:ro
      - ./tests:/app/tests:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    networks: [demo-only]
  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on: [demo]
    read_only: true
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=4m
      - /var/run:size=1m
    ports:
      - "127.0.0.1:8080:8080"
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    networks: [demo-only, loopback-publish]
networks:
  demo-only:
    internal: true
  loopback-publish: {}
